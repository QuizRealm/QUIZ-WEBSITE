<!DOCTYPE html>
<html lang="en">
<head>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6205081520399538"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rank It</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SortableJS for buttery smooth drag and drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        /* Smooth, Expensive Animations */
        body {
            overscroll-behavior-y: contain; /* Prevents pull-to-refresh on mobile */
            -webkit-tap-highlight-color: transparent;
        }
        
        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Drag state styling */
        .sortable-ghost {
            opacity: 0.2;
        }
        
        .sortable-chosen {
            transform: scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.25);
            background-color: #27272a !important; /* zinc-800 */
            border-color: #8b5cf6 !important; /* violet-500 */
            z-index: 50;
        }

        .sortable-drag {
            cursor: grabbing !important;
        }

        .drag-handle {
            touch-action: none; /* Prevents scrolling when dragging */
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans flex flex-col items-center py-10 px-5 antialiased selection:bg-violet-500 selection:text-white">

    <div id="game-container" class="w-full max-w-md flex flex-col gap-8 slide-up">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-400">
                Rank It.
            </h1>
            <p class="text-zinc-400 text-sm font-medium" id="round-indicator">Round 1 of 5</p>
            <p class="text-zinc-500 text-xs mt-1">Drag to rank. #1 is the Absolute Best, #5 is the Absolute Worst.</p>
        </header>

        <!-- Sortable List Container -->
        <div id="rank-list" class="flex flex-col gap-3">
            <!-- Items injected by JS -->
        </div>

        <!-- Action Area -->
        <div class="flex flex-col gap-4 mt-2">
            <button id="lock-btn" class="w-full py-4 rounded-2xl bg-zinc-100 text-zinc-950 font-bold text-lg shadow-[0_0_20px_rgba(244,244,245,0.1)] hover:bg-white hover:scale-[1.02] hover:shadow-[0_0_25px_rgba(139,92,246,0.4)] transition-all duration-300 active:scale-95">
                Lock It In
            </button>
        </div>

        <!-- Result/Judgement Area (Hidden by default) -->
        <div id="result-area" class="hidden flex-col items-center gap-6 bg-zinc-900 border border-zinc-800 rounded-3xl p-6 fade-in shadow-2xl shadow-violet-900/10">
            <div class="text-4xl">🔮</div>
            <p id="judgement-text" class="text-center text-lg font-medium text-zinc-200 leading-relaxed"></p>
            <button id="next-btn" class="w-full py-3 rounded-xl bg-violet-600 text-white font-semibold hover:bg-violet-500 transition-colors active:scale-95">
                Next Round
            </button>
        </div>

    </div>

    <script>
        // 5 Rounds of Highly Relatable, Arguable Human Experiences
        const roundsData = [
            {
                items: [
                    "Finding $5 in an old coat",
                    "Stepping in a wet spot with fresh socks",
                    "Canceled plans so you can sleep",
                    "A warm public toilet seat",
                    "Getting a text back immediately"
                ]
            },
            {
                items: [
                    "Food arriving exactly when you pick a movie",
                    "Biting the inside of your own cheek",
                    "Unskippable 30-second ads",
                    "Flipping to the cool side of the pillow",
                    "Remembering a cringe moment from 5 years ago"
                ]
            },
            {
                items: [
                    "Waking up and realizing you have 2 more hours to sleep",
                    "Someone holding the door too long so you have to jog",
                    "Hitting every single red light when you're late",
                    "Perfectly peeling a sticker off in one piece",
                    "Dropping your phone flat on your face in bed"
                ]
            },
            {
                items: [
                    "Plugging in a USB right on the first try",
                    "Stubbing your pinky toe on the bed frame",
                    "The Wi-Fi dropping right at the climax of a show",
                    "Taking off tight shoes after a long day",
                    "Laughing at a joke you didn't actually hear"
                ]
            },
            {
                items: [
                    "Losing the TV remote in the blankets",
                    "Washing your hair after 4 days of dry shampoo",
                    "Getting into a freshly made bed after a shower",
                    "When someone leaves your room and doesn't shut the door",
                    "Nail clippers that actually cut cleanly"
                ]
            }
        ];

        // Specific, highly judgmental roasts based on what they put at #1 or #5
        const specificRoasts = {
            "Stepping in a wet spot with fresh socks": "You put stepping in a wet spot at #1? You are an absolute psychopath and a danger to society.",
            "A warm public toilet seat": "A warm public toilet seat at #1? You thrive on the chaotic energy of strangers. Seek therapy.",
            "Canceled plans so you can sleep": "Canceled plans at #1. You are chronically exhausted and your social battery has been at 1% since 2019.",
            "Unskippable 30-second ads": "You like unskippable ads? You're either a marketing executive or genuinely unhinged.",
            "Biting the inside of your own cheek": "Putting physical pain at #1 is certainly a choice. Who hurt you?",
            "Someone holding the door too long so you have to jog": "You ranked the awkward door-jog as the absolute best. You love people-pleasing a little too much.",
            "The Wi-Fi dropping right at the climax of a show": "Ranking dropped Wi-Fi at #1 means you're just clicking randomly. Or you hate technology.",
            "When someone leaves your room and doesn't shut the door": "You like open doors? You clearly grew up without siblings or boundaries."
        };

        // Game State
        let currentRound = 0;
        let sortableInstance = null;

        const listContainer = document.getElementById('rank-list');
        const lockBtn = document.getElementById('lock-btn');
        const resultArea = document.getElementById('result-area');
        const nextBtn = document.getElementById('next-btn');
        const roundIndicator = document.getElementById('round-indicator');
        const judgementText = document.getElementById('judgement-text');

        // Helper: Shuffle array so items aren't pre-ranked
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Render a round
        function loadRound(roundIndex) {
            listContainer.innerHTML = '';
            resultArea.classList.add('hidden');
            lockBtn.classList.remove('hidden');
            roundIndicator.innerText = `Round ${roundIndex + 1} of ${roundsData.length}`;
            
            const shuffledItems = shuffle([...roundsData[roundIndex].items]);

            shuffledItems.forEach((text, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = "rank-item group flex items-center gap-4 bg-[#18181b] border border-zinc-800/50 p-4 rounded-2xl cursor-grab transition-colors hover:border-zinc-700";
                itemDiv.dataset.text = text;
                
                itemDiv.innerHTML = `
                    <div class="rank-number flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-zinc-900 text-zinc-500 font-bold text-sm border border-zinc-800 transition-colors">
                        ${index + 1}
                    </div>
                    <div class="flex-1 font-medium text-zinc-200 leading-snug">
                        ${text}
                    </div>
                    <div class="drag-handle text-zinc-600 group-hover:text-violet-400 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
                        </svg>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });

            // Initialize SortableJS
            if (sortableInstance) sortableInstance.destroy();
            sortableInstance = new Sortable(listContainer, {
                animation: 250,
                easing: "cubic-bezier(0.25, 1, 0.5, 1)", // Apple-like smooth easing
                handle: ".rank-item",
                ghostClass: "sortable-ghost",
                chosenClass: "sortable-chosen",
                dragClass: "sortable-drag",
                onEnd: updateNumbers
            });
        }

        // Update the 1-5 numbers visually after a drag event
        function updateNumbers() {
            const items = listContainer.querySelectorAll('.rank-item');
            items.forEach((item, index) => {
                const numBadge = item.querySelector('.rank-number');
                numBadge.innerText = index + 1;
                // Highlight #1 dynamically
                if (index === 0) {
                    numBadge.classList.replace('bg-zinc-900', 'bg-violet-500/20');
                    numBadge.classList.replace('text-zinc-500', 'text-violet-400');
                    numBadge.classList.replace('border-zinc-800', 'border-violet-500/30');
                } else {
                    numBadge.classList.replace('bg-violet-500/20', 'bg-zinc-900');
                    numBadge.classList.replace('text-violet-400', 'text-zinc-500');
                    numBadge.classList.replace('border-violet-500/30', 'border-zinc-800');
                }
            });
        }

        // Generate the funny judgement
        function generateJudgement(topItem, bottomItem) {
            // Check for specific unhinged roasts
            if (specificRoasts[topItem]) {
                return specificRoasts[topItem];
            }
            if (specificRoasts[bottomItem]) {
                return specificRoasts[bottomItem];
            }

            // Fallback generic but funny roasts
            const genericRoasts = [
                `You put "${topItem}" at #1? Your priorities are deeply fascinating and slightly concerning.`,
                `Ranking "${bottomItem}" as the absolute worst tells me you have zero tolerance for minor inconveniences.`,
                `The fact that "${topItem}" brings you this much joy means you're surviving entirely on small bursts of dopamine.`,
                `You rejected "${bottomItem}" so aggressively. I respect the boundaries, but I question your methods.`,
                `Honestly, a very solid ranking. Except for putting "${topItem}" first. That's just wild.`
            ];
            
            return genericRoasts[Math.floor(Math.random() * genericRoasts.length)];
        }

        // Lock in button click
        lockBtn.addEventListener('click', () => {
            sortableInstance.option("disabled", true); // Disable dragging
            lockBtn.classList.add('hidden');
            resultArea.classList.remove('hidden');

            // Get current order
            const currentOrder = Array.from(listContainer.querySelectorAll('.rank-item')).map(item => item.dataset.text);
            const topItem = currentOrder[0];
            const bottomItem = currentOrder[4];

            judgementText.innerText = generateJudgement(topItem, bottomItem);

            // Change button text if it's the last round
            if (currentRound === roundsData.length - 1) {
                nextBtn.innerText = "Play Again";
                nextBtn.classList.replace('bg-violet-600', 'bg-zinc-100');
                nextBtn.classList.replace('text-white', 'text-zinc-950');
                nextBtn.classList.replace('hover:bg-violet-500', 'hover:bg-white');
            }
        });

        // Next round button click
        nextBtn.addEventListener('click', () => {
            currentRound++;
            if (currentRound >= roundsData.length) {
                // Reset game
                currentRound = 0;
                nextBtn.innerText = "Next Round";
                nextBtn.classList.replace('bg-zinc-100', 'bg-violet-600');
                nextBtn.classList.replace('text-zinc-950', 'text-white');
                nextBtn.classList.replace('hover:bg-white', 'hover:bg-violet-500');
            }
            loadRound(currentRound);
            updateNumbers();
        });

        // Initialize Game
        loadRound(currentRound);
        updateNumbers();

    </script>
</body>
</html>
