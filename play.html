<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-ML3F7KLZ');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controller | QuizRealm</title>
    <meta name="theme-color" content="#0f172a">
    <script type="module" src="firebase-config.js"></script>
    <script type="module">
        import { doc, updateDoc, onSnapshot, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        window.fs = { doc, updateDoc, onSnapshot, getDoc, setDoc };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }, colors: { brand: '#6366f1', surface: '#1e293b', background: '#0f172a', opt0: '#ef4444', opt1: '#3b82f6', opt2: '#eab308', opt3: '#22c55e' } } } }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; touch-action: manipulation; }
        .game-btn { border-radius: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: all 0.1s; text-align: center; padding: 10px; }
        .game-btn:active { transform: translateY(4px); box-shadow: none; filter: brightness(0.9); }
        .timer-progress { transition: width 1s linear; }
    </style>
</head>

<body class="flex flex-col h-[100dvh]">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-ML3F7KLZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div id="join-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-background hidden">
        <div class="w-full max-w-sm p-8 rounded-3xl border border-white/10 text-center shadow-2xl bg-surface/90 backdrop-blur">
            <h2 class="text-2xl font-black text-white mb-2">Join Game</h2>
            <input type="text" id="join-nick" placeholder="NICKNAME" maxlength="12" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-4 text-center font-bold text-white mb-4 uppercase">
            <button onclick="confirmJoin()" class="w-full py-4 bg-brand rounded-xl font-bold text-white">ENTER LOBBY</button>
        </div>
    </div>

    <nav class="bg-surface/90 backdrop-blur border-b border-white/10 px-4 py-3 flex justify-between items-center fixed top-0 w-full z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-white text-xs" id="avatar-disp">?</div>
            <span class="font-bold text-sm text-white truncate max-w-[120px]" id="nick-disp">...</span>
        </div>
        <div class="bg-brand/20 px-3 py-1 rounded-full text-brand font-mono font-bold text-sm" id="score-disp">0</div>
    </nav>

    <main class="flex-grow pt-20 px-4 pb-6 relative z-10 w-full max-w-md mx-auto h-full overflow-hidden">
        
        <div id="view-lobby" class="hidden flex-col items-center justify-center h-full text-center">
            <div class="w-24 h-24 bg-surface rounded-full flex items-center justify-center mb-6 shadow-xl border border-white/10">
                <i class="fas fa-gamepad text-4xl text-brand animate-pulse"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white mb-2">You're In!</h1>
            <p class="text-slate-400 text-sm">Wait for host.</p>
        </div>

        <div id="view-game" class="hidden flex-col h-full">
            <div class="w-full h-2 bg-slate-800 rounded-full mb-4 overflow-hidden">
                <div id="timer-bar" class="h-full bg-brand w-full"></div>
            </div>

            <div id="q-card" class="mb-4 p-4 bg-surface rounded-2xl border border-white/10 shadow-lg min-h-[100px] flex items-center justify-center text-center">
                <p id="q-text" class="text-lg font-bold text-white leading-tight">Loading...</p>
            </div>
            
            <div class="grid grid-cols-1 gap-3 flex-grow content-start pb-safe" id="btn-grid"></div>
        </div>

        <div id="view-feedback" class="hidden flex-col items-center justify-center h-full text-center">
            <div class="w-20 h-20 bg-slate-700 rounded-full flex items-center justify-center mb-4">
                <i class="fas fa-check text-3xl text-white"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Answer Sent</h2>
            <div class="mt-4 bg-surface/50 px-6 py-2 rounded-full border border-white/5">
                <p class="text-slate-400 text-sm">Players Remaining: <span id="wait-count" class="text-white font-bold">...</span></p>
            </div>
        </div>

        <div id="view-result" class="hidden flex-col items-center justify-center h-full text-center px-4">
            <div id="res-icon-bg" class="w-28 h-28 rounded-full flex items-center justify-center mb-6 shadow-2xl">
                <i id="res-icon" class="fas fa-star text-5xl text-white"></i>
            </div>
            <h1 id="res-title" class="text-4xl font-black text-white mb-2">Correct!</h1>
            
            <div class="bg-surface/50 p-4 rounded-xl border border-white/10 w-full max-w-xs mt-4">
                <div class="text-xs text-slate-500 uppercase font-bold mb-1">Correct Answer</div>
                <div id="res-text" class="text-white font-bold text-lg">...</div>
            </div>
        </div>
    </main>

    <script type="module">
        let info = {};
        const urlParams = new URLSearchParams(window.location.search);
        const urlCode = urlParams.get('code');
        let ROOM_REF, myAnswer = null;
        let totalPlayers = 0;

        function initController() {
            try { info = JSON.parse(localStorage.getItem('qr_player_info')); } catch(e){}

            if ((!info || !info.nickname) && urlCode) {
                document.getElementById('join-modal').classList.remove('hidden');
                return;
            }
            if (info && urlCode && info.roomCode !== urlCode) {
                info.roomCode = urlCode;
                localStorage.setItem('qr_player_info', JSON.stringify(info));
            }
            if ((!info || !info.roomCode) && !urlCode) {
                window.location.href = 'group-hub.html';
                return;
            }
            if (info && info.nickname && info.roomCode) boot();
        }

        window.confirmJoin = function() {
            const nick = document.getElementById('join-nick').value.trim().toUpperCase();
            if (nick.length < 2) return alert("Enter nickname!");
            
            const newInfo = { nickname: nick, roomCode: urlCode, role: 'player', timestamp: Date.now() };
            localStorage.setItem('qr_player_info', JSON.stringify(newInfo));
            info = newInfo;
            document.getElementById('join-modal').classList.add('hidden');
            boot();
        }

        async function boot() {
            if (!window.db || !window.fs) { setTimeout(boot, 100); return; }

            try {
                document.getElementById('nick-disp').innerText = info.nickname;
                document.getElementById('avatar-disp').innerText = info.nickname.charAt(0);
                ROOM_REF = window.fs.doc(window.db, "group_rooms", info.roomCode);

                const playerKey = `players.${info.nickname}`;
                let joinData = {}; joinData[playerKey] = { score: 0, avatar: 'A', joinedAt: Date.now() };
                
                await window.fs.updateDoc(ROOM_REF, joinData).catch(async () => {
                    await window.fs.setDoc(ROOM_REF, joinData, { merge: true });
                });

                window.fs.onSnapshot(ROOM_REF, (snap) => {
                    if(!snap.exists()) { alert("Room closed"); window.location.href='group-hub.html'; return; }
                    handleState(snap.data());
                });
            } catch (err) { alert("Connection Error"); }
        }

        function handleState(data) {
            // Update Stats
            if (data.players) {
                if(data.players[info.nickname]) {
                    document.getElementById('score-disp').innerText = data.players[info.nickname].score;
                }
                totalPlayers = Object.keys(data.players).length;
            }

            // Update Wait Count
            if (data.answers) {
                const ansCount = Object.keys(data.answers).length;
                document.getElementById('wait-count').innerText = `${totalPlayers - ansCount}`;
            }

            // --- VIEW ROUTING ---
            if(data.status === 'LOBBY') showView('view-lobby');
            
            if(data.status === 'GAME') {
                if (myAnswer === null) {
                    showView('view-game');
                    
                    if(data.currentQuestion) {
                        document.getElementById('q-text').innerText = data.currentQuestion.text;
                        
                        // Timer Animation
                        const bar = document.getElementById('timer-bar');
                        bar.style.transition = 'none'; bar.style.width = '100%';
                        setTimeout(() => { bar.style.transition = 'width 20s linear'; bar.style.width = '0%'; }, 50);

                        // Buttons
                        const opts = data.currentQuestion.options || ["A", "B", "C", "D"];
                        const colors = ['bg-opt0', 'bg-opt1', 'bg-opt2', 'bg-opt3'];
                        const icons = ['square', 'circle', 'play', 'diamond'];
                        
                        document.getElementById('btn-grid').innerHTML = opts.map((opt, i) => `
                            <button onclick="submit(${i})" class="game-btn ${colors[i]} h-16 text-white w-full flex-row gap-4">
                                <i class="fas fa-${icons[i]} ${i===2?'rotate-[-90deg]':''} text-xl"></i>
                                <span class="text-lg font-bold">${opt}</span>
                            </button>
                        `).join('');
                    }
                }
            }

            if(data.status === 'RESULT') {
                const correctIdx = Number(data.correctIndex);
                const myAnsIdx = Number(myAnswer);
                const isCorrect = (myAnsIdx === correctIdx);
                
                const title = document.getElementById('res-title');
                const bg = document.getElementById('res-icon-bg');
                const icon = document.getElementById('res-icon');
                
                document.getElementById('res-text').innerText = data.correctText || "Unknown";

                if(isCorrect) {
                    title.innerText = "Correct!";
                    title.className = "text-4xl font-black text-green-500 mb-2";
                    bg.className = "w-28 h-28 rounded-full bg-green-500 flex items-center justify-center mb-6 shadow-2xl";
                    icon.className = "fas fa-check text-5xl text-white";
                    if(navigator.vibrate) navigator.vibrate([50,50,50]);
                } else {
                    title.innerText = "Wrong!";
                    title.className = "text-4xl font-black text-red-500 mb-2";
                    bg.className = "w-28 h-28 rounded-full bg-surface border-2 border-red-500 flex items-center justify-center mb-6 shadow-xl";
                    icon.className = "fas fa-times text-5xl text-red-500";
                    if(navigator.vibrate) navigator.vibrate(300);
                }
                
                myAnswer = null; // Reset for next
                showView('view-result');
            }
        }

        window.submit = function(idx) {
            myAnswer = idx;
            if(navigator.vibrate) navigator.vibrate(50);
            
            let ansData = {};
            ansData[`answers.${info.nickname}`] = { val: idx, time: Date.now() };
            window.fs.updateDoc(ROOM_REF, ansData);
            
            showView('view-feedback');
        }

        function showView(id) {
            ['view-lobby','view-game','view-feedback','view-result'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
                document.getElementById(v).classList.remove('flex');
            });
            const el = document.getElementById(id);
            el.classList.remove('hidden');
            el.classList.add('flex');
        }

        initController();
    </script>
</body>
</html>
