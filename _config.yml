# GitHub Pages: publish the generated static website, not maintenance tooling.
# Jekyll 3 matches exclusion prefixes: "site" also matches "sitemap.xml", and
# "tools" matches the public tools-import.html retirement notice. Keep both.
include:
  - sitemap.xml
  - tools-import.html
exclude:
  - node_modules
  - site
  - tools
  - tests
  - docs
  - .cache
  - test-results
  - playwright-report
  - package.json
  - package-lock.json
  - playwright.config.cjs
  - README.md
  - REBUILD.md
