name: IndexNow Ping
on:
  workflow_run:
    workflows: [Site quality]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  indexnow-submit:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Submit canonical URLs
        run: python tools/indexnow.py
