name: IndexNow Ping

# This tells GitHub to run this code every time you push to the main branch
on:
  push:
    branches:
      - main  # CHANGE THIS if your default branch is named 'master'

jobs:
  indexnow-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Submit to IndexNow (Bing & Yandex)
        uses: bojieyang/indexnow-action@v2
        with:
          # Replace this with your actual sitemap URL
          sitemap-location: 'https://thequizrealm.com/sitemap.xml'
          
          # This pulls the key from the "Secret" we will make in Phase 3
          key: ${{ secrets.INDEXNOW_KEY }}
