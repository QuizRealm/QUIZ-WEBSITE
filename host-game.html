<!DOCTYPE html>
<html lang="en">
<head>

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-ML3F7KLZ');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Host Console | QuizRealm Group</title>
    <meta name="theme-color" content="#0f172a">

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="game-engine.js"></script>
    <script src="components.js" defer></script>
    <script type="module" src="assets/ux-core.js"></script>
    
    <script src="data.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: '#6366f1', 
                        surface: '#1e293b',
                        background: '#0f172a',
                    },
                    animation: {
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'pulse-slow': 'pulse 3s infinite'
                    },
                    keyframes: {
                        pop: { '0%': { transform: 'scale(0.5)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 60%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.3);
        }
        /* Player Avatar Grid */
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1rem;
        }
        .player-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            animation: pop 0.4s ease-out;
        }
    </style>
</head>

<body class="antialiased">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-ML3F7KLZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <quiz-header></quiz-header>

    <main class="flex-grow w-full max-w-6xl mx-auto px-4 py-8 relative z-10 flex flex-col items-center justify-center min-h-[600px]">
        
        <div id="lobby-screen" class="w-full max-w-5xl flex flex-col md:flex-row gap-8 items-center justify-center">
            
            <div class="glass-card rounded-3xl p-8 flex flex-col items-center text-center w-full md:w-1/3 border-t-4 border-t-brand">
                <div class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-2">Join Code</div>
                <div id="display-code" class="font-mono text-6xl font-black text-white mb-6 tracking-widest">----</div>
                
                <div class="bg-white p-4 rounded-xl mb-6">
                    <div id="qrcode"></div>
                </div>
                
                <p class="text-slate-400 text-xs uppercase tracking-wide">Scan to Join</p>
                <div class="mt-4 px-4 py-2 bg-brand/10 rounded-lg text-brand font-bold text-sm flex items-center gap-2">
                    <i class="fas fa-users"></i> <span id="player-count">0</span> Players Ready
                </div>
            </div>

            <div class="glass-card rounded-3xl p-8 w-full md:w-2/3 h-[500px] flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="font-display font-bold text-2xl text-white">Lobby</h2>
                    <div class="text-xs text-slate-400 animate-pulse-slow">Waiting for players...</div>
                </div>
                
                <div id="player-grid" class="avatar-grid flex-grow content-start overflow-y-auto custom-scroll">
                    <div class="col-span-full flex flex-col items-center justify-center h-48 text-slate-600">
                        <i class="fas fa-ghost text-4xl mb-2 opacity-50"></i>
                        <p>It's quiet in here...</p>
                    </div>
                </div>

                <div class="pt-6 mt-4 border-t border-white/5 flex justify-end">
                    <button id="start-btn" onclick="startGame()" disabled
                        class="px-8 py-3 bg-slate-700 text-slate-400 font-bold rounded-xl transition cursor-not-allowed opacity-50">
                        Start Game
                    </button>
                </div>
            </div>
        </div>

        <div id="game-screen" class="hidden w-full max-w-4xl text-center">
            <h1 class="text-white text-3xl">Game in Progress...</h1>
        </div>

    </main>

    <quiz-footer></quiz-footer>

    <script>
        // --- 1. SETUP ---
        const settings = JSON.parse(localStorage.getItem('qr_host_settings'));
        
        // Safety Check: Redirect if no settings found
        if (!settings || !settings.roomCode) {
            alert("No active session found. Redirecting to Hub.");
            window.location.href = 'group-hub.html';
        }

        // --- 2. RENDER LOBBY INFO ---
        document.getElementById('display-code').textContent = settings.roomCode;

        // Generate QR Code
        const joinUrl = `${window.location.origin}/play.html?code=${settings.roomCode}`;
        new QRCode(document.getElementById("qrcode"), {
            text: joinUrl,
            width: 180,
            height: 180,
            colorDark : "#0f172a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // --- 3. SIMULATE PLAYER JOINS (Placeholder for Realtime DB) ---
        // In a real app, this would be: onSnapshot(doc(db, 'rooms', code), (doc) => updatePlayers(doc.data().players))
        
        let players = []; 

        // Debug function to simulate players joining for testing UI
        function simJoin(name) {
            players.push(name);
            updateLobbyUI();
        }

        function updateLobbyUI() {
            const grid = document.getElementById('player-grid');
            const countSpan = document.getElementById('player-count');
            const startBtn = document.getElementById('start-btn');

            countSpan.textContent = players.length;

            if (players.length === 0) {
                grid.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center h-48 text-slate-600"><i class="fas fa-ghost text-4xl mb-2 opacity-50"></i><p>It's quiet in here...</p></div>`;
                startBtn.disabled = true;
                startBtn.classList.remove('bg-brand', 'text-white', 'hover:bg-brandHover', 'shadow-lg');
                startBtn.classList.add('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');
            } else {
                grid.innerHTML = players.map(p => `
                    <div class="player-card">
                        <div class="w-10 h-10 mx-auto bg-gradient-to-br from-indigo-500 to-purple-500 rounded-full mb-2 flex items-center justify-center text-white font-bold text-sm shadow-inner">
                            ${p.charAt(0).toUpperCase()}
                        </div>
                        <div class="text-xs font-bold text-slate-200 truncate">${p}</div>
                    </div>
                `).join('');
                
                // Enable Start Button if > 0 players (usually > 1 for competition)
                startBtn.disabled = false;
                startBtn.classList.remove('bg-slate-700', 'text-slate-400', 'cursor-not-allowed', 'opacity-50');
                startBtn.classList.add('bg-brand', 'text-white', 'hover:bg-brandHover', 'shadow-lg');
            }
        }

        // --- 4. START GAME LOGIC ---
        function startGame() {
            // Load Questions based on Category Key
            if (typeof QUESTION_BANKS === 'undefined') {
                alert("Error: Question Bank not loaded.");
                return;
            }

            const category = settings.categoryKey;
            const bank = QUESTION_BANKS[category];

            if (!bank) {
                alert("Error: Category not found in database.");
                return;
            }

            console.log(`Starting Game: ${category} with ${players.length} players.`);
            console.log("Questions Loaded:", bank);

            // In the next step, we will hide 'lobby-screen' and show 'game-screen'
            // and start the Question Loop.
            alert("Game Starting! (Question Loop to be implemented in next update)");
        }

        // For Testing: Auto-add a player after 2 seconds
        setTimeout(() => simJoin("TestUser"), 2000);

    </script>
</body>
</html>
