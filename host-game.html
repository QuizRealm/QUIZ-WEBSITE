<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-ML3F7KLZ');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Host Console | QuizRealm</title>
    <meta name="theme-color" content="#0f172a">

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="game-engine.js"></script>
    <script src="components.js" defer></script>
    <script type="module" src="assets/ux-core.js"></script>
    <script src="data.js"></script>
    
    <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { brand: '#6366f1', surface: '#1e293b', background: '#0f172a' },
                    animation: { 'pop': 'pop 0.3s ease-out' },
                    keyframes: { pop: { '0%': { transform: 'scale(0.8)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } } }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .timer-bar { transition: width 1s linear; }
    </style>
</head>

<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-ML3F7KLZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <quiz-header></quiz-header>

    <div id="loading-overlay" class="fixed inset-0 bg-background z-50 flex items-center justify-center">
        <div class="text-center animate-pulse">
            <h2 class="text-2xl font-bold text-white">Initializing Host...</h2>
            <p class="text-slate-400 text-sm mt-2">Connecting to Firebase</p>
        </div>
    </div>

    <main class="flex-grow w-full max-w-7xl mx-auto px-6 py-8 relative z-10 flex flex-col justify-center min-h-[600px]">
        
        <div id="error-banner" class="hidden w-full bg-red-500/10 border border-red-500/50 text-red-200 p-4 rounded-xl text-center mb-6"></div>

        <div id="view-lobby" class="hidden w-full flex-col gap-8 animate-pop">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 w-full">
                <div class="lg:col-span-4 glass rounded-3xl p-8 flex flex-col items-center text-center border-t-4 border-brand">
                    <div class="bg-white p-4 rounded-xl mb-6 shadow-xl"><div id="qrcode"></div></div>
                    <div class="text-sm font-bold text-slate-400 uppercase tracking-widest">Room Code</div>
                    <div id="display-code" class="text-7xl font-black text-white tracking-widest leading-none my-2">----</div>
                    <div id="manual-link" class="text-xs text-blue-400 underline cursor-pointer mt-2">Open Player Link</div>
                </div>

                <div class="lg:col-span-8 flex flex-col gap-6">
                    <div class="glass rounded-2xl p-6 border-l-4 border-green-500">
                        <h3 class="text-xl font-bold text-white mb-2"><i class="fas fa-gamepad mr-2"></i>Game Ready</h3>
                        <p id="game-desc" class="text-slate-400">Waiting for players to join via QR code...</p>
                    </div>

                    <div class="glass rounded-3xl p-6 flex-grow flex flex-col min-h-[300px]">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-white">Lobby <span id="p-count" class="text-brand ml-2">0</span></h2>
                            <div class="text-xs text-green-400 font-mono animate-pulse">● LIVE</div>
                        </div>
                        <div id="p-grid" class="grid grid-cols-3 md:grid-cols-4 gap-4 content-start"></div>
                        <button id="start-btn" onclick="startGame()" disabled class="mt-auto w-full py-4 bg-slate-700 text-slate-400 font-bold rounded-xl transition-all cursor-not-allowed">
                            Start Game
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-game" class="hidden w-full max-w-5xl mx-auto flex-col items-center animate-pop">
            <div class="w-full h-4 bg-surface rounded-full mb-8 overflow-hidden border border-white/10">
                <div id="timer-bar" class="h-full bg-gradient-to-r from-brand to-purple-500 w-full"></div>
            </div>
            <div class="glass w-full p-10 rounded-3xl text-center mb-8 border-t-4 border-brand">
                <div class="flex justify-between mb-8"><span class="px-3 py-1 rounded bg-slate-800 text-xs text-slate-300 font-mono">Q <span id="q-idx">1</span></span></div>
                <h1 id="q-text" class="text-4xl md:text-5xl font-extrabold text-white mb-10 leading-tight">Loading...</h1>
                <div id="opt-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5 text-left"></div>
            </div>
            <div class="glass px-8 py-3 rounded-full flex gap-4 border border-white/10">
                <span class="text-slate-300 font-bold text-sm uppercase">Answers:</span>
                <span id="ans-count" class="text-white font-mono font-bold text-2xl pl-2 border-l border-white/10">0</span>
            </div>
        </div>

        <div id="view-scores" class="hidden w-full max-w-3xl mx-auto flex-col items-center animate-pop">
            <h1 class="text-5xl font-black text-white mb-8">Results</h1>
            <div id="score-list" class="w-full space-y-3 mb-10"></div>
            <button onclick="nextRound()" class="px-10 py-4 bg-brand text-white font-bold rounded-xl shadow-lg hover:scale-105 transition">Next Question</button>
        </div>

    </main>

    <quiz-footer></quiz-footer>

    <script type="module">
        import { doc, setDoc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- INIT ---
        let settings = {};
        try { settings = JSON.parse(localStorage.getItem('qr_host_settings')); } catch(e){}

        if (!settings || !settings.roomCode) {
            document.getElementById('error-banner').innerHTML = "Session missing. <a href='group-hub.html' class='underline'>Return to Hub</a>";
            document.getElementById('error-banner').classList.remove('hidden');
            document.getElementById('loading-overlay').classList.add('hidden');
            throw new Error("No Session");
        }

        // --- GLOBAL STATE ---
        let gameState = { players: {}, questions: [], index: 0, timer: null };
        let ROOM_REF;
        const TIMER_DURATION = 20;

        // --- BOOTSTRAP ---
        async function boot() {
            // Wait for firebase-config to load window.db
            if (!window.db) {
                console.log("Waiting for Firebase...");
                setTimeout(boot, 100);
                return;
            }

            try {
                // UI SETUP
                document.getElementById('display-code').innerText = settings.roomCode;
                if (typeof CATEGORY_CONFIG !== 'undefined' && CATEGORY_CONFIG[settings.categoryKey]) {
                    document.getElementById('game-desc').textContent = CATEGORY_CONFIG[settings.categoryKey].desc;
                }

                // QR CODE
                const joinUrl = `${window.location.origin}/play.html?code=${settings.roomCode}`;
                const qrBox = document.getElementById("qrcode");
                qrBox.innerHTML = "";
                
                // Fallback Link
                const linkBox = document.getElementById('manual-link');
                linkBox.onclick = () => window.open(joinUrl, '_blank');

                try {
                    new QRCode(qrBox, { text: joinUrl, width: 160, height: 160, colorDark : "#0f172a", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.L });
                } catch(e) {
                    console.error("QR Error", e);
                    qrBox.innerHTML = "<div class='text-red-500 text-xs p-2'>QR Failed.<br>Use Code.</div>";
                }

                // FIREBASE INIT
                ROOM_REF = doc(window.db, "group_rooms", settings.roomCode);
                
                await setDoc(ROOM_REF, {
                    status: 'LOBBY',
                    hostId: 'HOST_' + Date.now(),
                    category: settings.categoryKey,
                    players: {},
                    answers: {},
                    currentQuestion: null,
                    createdAt: Date.now()
                });

                document.getElementById('loading-overlay').classList.add('hidden');
                document.getElementById('view-lobby').classList.remove('hidden');
                document.getElementById('view-lobby').classList.add('flex');

                // LISTENER
                onSnapshot(ROOM_REF, (snap) => {
                    const data = snap.data();
                    if(!data) return;

                    if(data.status === 'LOBBY') {
                        gameState.players = data.players || {};
                        updateLobby();
                    }
                    if(data.status === 'GAME') {
                        const count = Object.keys(data.answers || {}).length;
                        const total = Object.keys(gameState.players).length;
                        document.getElementById('ans-count').innerText = `${count} / ${total}`;
                        if(total > 0 && count >= total) endQuestion();
                    }
                });

            } catch(e) {
                console.error(e);
                alert("Critical Init Error: " + e.message);
            }
        }

        function updateLobby() {
            const names = Object.keys(gameState.players);
            document.getElementById('p-count').innerText = names.length;
            const grid = document.getElementById('p-grid');
            const btn = document.getElementById('start-btn');

            if(names.length > 0) {
                btn.disabled = false;
                btn.classList.remove('bg-slate-700', 'cursor-not-allowed');
                btn.classList.add('bg-brand', 'hover:bg-indigo-500', 'cursor-pointer');
                
                grid.innerHTML = names.map(n => `
                    <div class="bg-white/10 rounded-xl p-3 flex flex-col items-center animate-pop">
                        <div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-white mb-2">${n.charAt(0)}</div>
                        <span class="text-xs font-bold text-white truncate w-full text-center">${n}</span>
                    </div>
                `).join('');
            } else {
                btn.disabled = true;
                btn.classList.add('bg-slate-700', 'cursor-not-allowed');
                grid.innerHTML = "";
            }
        }

        // --- GAME LOGIC ---
        window.startGame = function() {
            if (!QUESTION_BANKS[settings.categoryKey]) { alert("Data Missing"); return; }
            
            const bank = QUESTION_BANKS[settings.categoryKey];
            let pool = [...(bank.easy||[]), ...(bank.medium||[])];
            pool.sort(() => Math.random() - 0.5);
            gameState.questions = pool.slice(0, 10);
            gameState.index = 0;

            document.getElementById('view-lobby').classList.add('hidden');
            document.getElementById('view-lobby').classList.remove('flex');
            document.getElementById('view-game').classList.remove('hidden');
            document.getElementById('view-game').classList.add('flex');
            
            startRound();
        }

        async function startRound() {
            const q = gameState.questions[gameState.index];
            document.getElementById('q-idx').innerText = gameState.index + 1;
            document.getElementById('q-text').innerText = q.question;
            document.getElementById('ans-count').innerText = `0 / ${Object.keys(gameState.players).length}`;

            const colors = ['bg-red-500', 'bg-blue-500', 'bg-yellow-500', 'bg-green-500'];
            document.getElementById('opt-grid').innerHTML = q.options.map((opt, i) => `
                <div class="flex items-center gap-4 p-5 rounded-2xl border border-white/10 bg-surface/60">
                    <div class="w-12 h-12 rounded-xl ${colors[i]} flex items-center justify-center text-white text-xl font-bold">${['A','B','C','D'][i]}</div>
                    <span class="text-xl font-bold text-white">${opt}</span>
                </div>
            `).join('');

            await updateDoc(ROOM_REF, {
                status: 'GAME',
                currentQuestion: {
                    text: settings.tvMode ? "See Host Screen" : q.question,
                    mobileMode: !settings.tvMode,
                    startTime: Date.now()
                },
                answers: {}
            });

            // Timer
            const bar = document.getElementById('timer-bar');
            bar.style.transition = 'none';
            bar.style.width = '100%';
            setTimeout(() => {
                bar.style.transition = `width ${TIMER_DURATION}s linear`;
                bar.style.width = '0%';
            }, 50);

            if(gameState.timer) clearTimeout(gameState.timer);
            gameState.timer = setTimeout(endQuestion, TIMER_DURATION * 1000);
        }

        async function endQuestion() {
            if(gameState.timer) clearTimeout(gameState.timer);
            
            const snap = await getDoc(ROOM_REF);
            const data = snap.data();
            const answers = data.answers || {};
            const q = gameState.questions[gameState.index];
            const startTime = data.currentQuestion.startTime;

            let updates = { status: 'RESULT', correctIndex: q.correctIndex };
            
            Object.entries(gameState.players).forEach(([nick, pData]) => {
                if(answers[nick] && answers[nick].val === q.correctIndex) {
                    const timeTaken = (answers[nick].time - startTime) / 1000;
                    const speedBonus = Math.max(0, Math.floor((1 - (timeTaken / TIMER_DURATION)) * 500));
                    gameState.players[nick].score = (pData.score || 0) + 1000 + speedBonus;
                }
                updates[`players.${nick}.score`] = gameState.players[nick].score;
            });

            await updateDoc(ROOM_REF, updates);
            setTimeout(showScores, 4000);
        }

        function showScores() {
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('view-game').classList.remove('flex');
            document.getElementById('view-scores').classList.remove('hidden');
            document.getElementById('view-scores').classList.add('flex');

            const list = document.getElementById('score-list');
            const sorted = Object.entries(gameState.players).sort(([,a], [,b]) => b.score - a.score).slice(0, 5);

            list.innerHTML = sorted.map(([name, data], i) => `
                <div class="flex items-center justify-between p-5 bg-surface rounded-2xl border border-white/5 shadow-lg">
                    <div class="flex items-center gap-6">
                        <div class="text-3xl font-black ${i===0 ? 'text-yellow-400' : 'text-slate-600'}">#${i+1}</div>
                        <div class="text-xl font-bold text-white">${name}</div>
                    </div>
                    <div class="text-2xl font-mono font-bold text-brand">${data.score}</div>
                </div>
            `).join('');
        }

        window.nextRound = function() {
            gameState.index++;
            if(gameState.index >= gameState.questions.length) {
                alert("Game Over!");
                window.location.href = 'group-hub.html';
                return;
            }
            document.getElementById('view-scores').classList.add('hidden');
            document.getElementById('view-scores').classList.remove('flex');
            document.getElementById('view-game').classList.remove('hidden');
            document.getElementById('view-game').classList.add('flex');
            startRound();
        }

        // Start Boot
        boot();
    </script>
</body>
</html>
